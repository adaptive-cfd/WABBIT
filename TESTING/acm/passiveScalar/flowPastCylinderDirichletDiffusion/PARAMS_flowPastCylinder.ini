;------------------------------------------------------------
;------------ WABBIT PARAMETER FILE TEMPLATE ----------------
;------------------------------------------------------------
; Passive-scalar test case: flow past a cylinder (significant refinement, FD4/CDF44),
; with ONE passive scalar initialized to 1.0 everywhere and a DIRICHLET (fixed
; concentration = 0) boundary condition at the cylinder. There is no source term:
; we simply watch the initially uniform scalar get depleted at the body and diffuse
; away from it, like a temperature field cooled by the obstacle.
; NOTE: unlike the (inviscid) base flowPastCylinder test, nu > 0 here so that the
; scalar (kappa = nu/Sc) actually diffuses visibly on a short simulated time.
; ATTENTION: nu, Sc and time_max below are placeholder choices tuned only to make the
; diffusion visible in a short test run -- please double check/adjust these.


[Domain]
dim=2;
domain_size=20 20;
periodic_BC=1 1;


[Blocks]
number_block_nodes=16;
number_ghost_nodes=;
number_ghost_nodes_rhs=;
; ACM: 3 (2D) + N_scalars = 3 + 1 = 4
number_equations=4;
number_equations_rhs=;
eps=1.0e-2;
eps_norm=Linfty;
max_treelevel=6;
min_treelevel=0;
max_forest_size=;
adapt_tree=1;
adapt_inicond=1;
inicond_refinements=0;
block_dist=sfc_hilbert;
coarsening_indicator=threshold-state-vector;
refinement_indicator=significant;
eps_normalized=1;
; which components to use for coarsening_indicator? [ux uy p scalar1]
; the scalar is excluded (0) so the grid is NOT adapted based on the scalar field.
threshold_state_vector_component=1 1 1 0;
threshold_mask=1;
force_maxlevel_dealiasing=0;
N_dt_per_grid=1;
useCoarseExtension=1;
useSecurityZone=1;


[Wavelet]
wavelet=CDF44;


[Time]
; ATTENTION: chosen to give the scalar enough time to visibly diffuse away from the
; cylinder -- please double check.
time_max=0.4;
walltime_max=4.9;
walltime_write=;
nt=;
CFL=1.5;
CFL_eta=0.99;
CFL_nu=;
write_method=fixed_time;
write_freq=2;
write_time=0.2;
dt_fixed=0.0;
dt_max=0.0;
time_step_method=RungeKuttaGeneric;
RKC_custom_scheme=no;
RKC_mu=;
RKC_mu_tilde=
RKC_nu=
RKC_gamma_tilde=
RKC_c=
s=10;
M_krylov=12;
krylov_subspace_dimension=fixed;
krylov_err_threshold=1.0e-3;


[Physics]
physics_type=ACM-new;
read_from_files=0;
input_files=;


[Saving]
N_fields_saved=1;
field_names=scalar1;


[Statistics]
nsave_stats=10;
tsave_stats=0.20;


[ACM-new]
c_0=12.5;
; ATTENTION: nu>0 (unlike the inviscid base cylinder test) so that the scalar diffuses visibly
nu=1.0e-2;
gamma_p=0;
u_mean_set=0.0 -1.0 0.0;
inicond=meanflow;
beta=0.05;
use_passive_scalar=1;
use_active_buoyancy_scalar=0;
compute_flow=1;
use_HIT_linear_forcing=0;
skew_symmetry=1;
p_eqn_model=;
nu_bulk=0.0;


[Sponge]
use_sponge=1;
sponge_type=p-norm;
p_sponge=8.0;
L_sponge=2.0;
C_sponge=8.0e-3;


[ConvectionDiffusion]
N_scalars=1;
; kappa = nu/Sc = 1.0e-2, giving a visible diffusion length over time_max.
Sc=1.0;
; Rayleigh number, unused here (use_active_buoyancy_scalar=0), but the parameter is mandatory.
Ra=1.0;
symmetric_buoyancy=0;
; scalar starts at a uniform value of 1.0 everywhere
inicond=one;
source=none;
; unused dummy values, required because source=none
x0source=0;
y0source=0;
z0source=0;
widthsource=0.2;
valuesource=1.0;
; unused for scalar_BC_type=dirichlet (only relevant for "neumann"), but mandatory to set.
C_eta=1e-3;
; absorb the scalar in the sponge layer, so it doesn't build up / wrap around the periodic domain
absorbing_sponge=1;
; Dirichlet (fixed concentration = 0.0) boundary condition at the cylinder
scalar_BC_type=dirichlet;


[Discretization]
order_discretization=FD_4th_central;
filter_type=no_filter;wavelet_filter;
filter_freq=1;

[VPM]
penalization=1;
mask_time_dependent_part=1;
mask_time_independent_part=1;
dont_use_pruned_tree_mask=1;
smoothing_type=cosine;
C_eta=1.34e-3;
geometry=cylinder;
x_cntr=10.0 10.0 0;
length=1.0;


[Debug]
test_ghost_nodes_synch=1;
test_treecode=1;
test_wavelet_decomposition=0;
flush_frequency=;
