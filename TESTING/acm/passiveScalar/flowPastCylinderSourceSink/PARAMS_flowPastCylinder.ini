;------------------------------------------------------------
;------------ WABBIT PARAMETER FILE TEMPLATE ----------------
;------------------------------------------------------------
; Passive-scalar test case: flow past a cylinder (significant refinement, FD4/CDF44),
; with two passive-scalar point sources upstream of the cylinder: one emitting (+1)
; and one absorbing (-1), placed side-by-side across the wake so the alternating
; vortex shedding braids the two dye streaks into a Karman-vortex-street pattern.
; The scalar uses a NEUMANN (no-flux/adiabatic) boundary condition at the cylinder,
; and is NOT used for grid adaptation (threshold_state_vector_component=0 for it).


[Domain]
dim=2;
domain_size=20 20;
periodic_BC=1 1;


[Blocks]
number_block_nodes=16;
number_ghost_nodes=;
number_ghost_nodes_rhs=;
; ACM: 3 (2D) + N_scalars = 3 + 2 = 5
number_equations=5;
number_equations_rhs=;
eps=1.0e-2;
eps_norm=Linfty;
max_treelevel=6;
min_treelevel=0;
max_forest_size=;
adapt_tree=1;
adapt_inicond=1;
inicond_refinements=0;
block_dist=sfc_hilbert;
coarsening_indicator=threshold-state-vector;
refinement_indicator=significant;
eps_normalized=1;
; which components to use for coarsening_indicator? [ux uy p scalar1 scalar2]
; the two scalars are excluded (0) so the grid is NOT adapted based on the scalar fields.
threshold_state_vector_component=1 1 1 0 0;
; also refine on the obstacle mask interface
threshold_mask=1;
force_maxlevel_dealiasing=0;
N_dt_per_grid=1;
useCoarseExtension=1;
useSecurityZone=1;


[Wavelet]
wavelet=CDF44;


[Time]
time_max=0.2;
walltime_max=4.9;
walltime_write=;
nt=;
CFL=1.5;
CFL_eta=0.99;
CFL_nu=;
write_method=fixed_time;
write_freq=2;
write_time=0.2;
dt_fixed=0.0;
dt_max=0.0;
time_step_method=RungeKuttaGeneric;
RKC_custom_scheme=no;
RKC_mu=;
RKC_mu_tilde=
RKC_nu=
RKC_gamma_tilde=
RKC_c=
s=10;
M_krylov=12;
krylov_subspace_dimension=fixed;
krylov_err_threshold=1.0e-3;


[Physics]
physics_type=ACM-new;
read_from_files=0;
input_files=;


[Saving]
N_fields_saved=2;
field_names=scalar1 scalar2;


[Statistics]
nsave_stats=10;
tsave_stats=0.20;


[ACM-new]
c_0=12.5;
nu=0.0;
gamma_p=0;
u_mean_set=0.0 -1.0 0.0;
inicond=meanflow;
beta=0.05;
; turn on the passive scalar, parameters are in [ConvectionDiffusion] below
use_passive_scalar=1;
use_active_buoyancy_scalar=0;
compute_flow=1;
use_HIT_linear_forcing=0;
skew_symmetry=1;
p_eqn_model=;
nu_bulk=0.0;


[Sponge]
use_sponge=1;
sponge_type=p-norm;
p_sponge=8.0;
L_sponge=2.0;
C_sponge=8.0e-3;


[ConvectionDiffusion]
; two scalars: scalar1 = source (+1), scalar2 = sink (-1)
N_scalars=2;
; Schmidt numbers (kappa = nu/Sc). Here nu=0.0 (inviscid flow), so the scalar is purely advected
Sc=1.0 1.0;
; Rayleigh number, unused here (use_active_buoyancy_scalar=0), but the parameter is mandatory.
Ra=1.0 1.0;
symmetric_buoyancy=0;
; both scalars start at zero and are built up by their "gaussian" source term below.
inicond=empty empty;
; scalar1 uses a "gaussian"/"blob" source (super-Gaussian weight, ~1 out to radius "widthsource"
; then falling off fast, so the visible size stays close to "widthsource"), scalar2 uses "circular"
; (disk of radius "widthsource" with a smooth cosine edge instead of a hard cutoff). Both relax the
; scalar towards "valuesource", centered at (x0source,y0source,z0source).
source=gaussian circular;
; placed in a row upstream of the cylinder (cylinder is at x_cntr=10,10; mean flow direction
; is -y, i.e. "upstream" is larger y), straddling the wake width so the two streaks get
; shed alternately, one on each side of the cylinder.
x0source=9.4 10.6;
y0source=12.0 12.0;
z0source=0 0;
widthsource=0.2 0.2;
; scalar1 is a source (relax to +1), scalar2 is a sink (relax to -1)
valuesource=1.0 -1.0;
; scalar's own diffusivity used only inside the obstacle for the Neumann (no-flux) penalization,
; independent of [VPM]::C_eta. The relaxation strength of the "gaussian"/"circular" sources above
; is NOT set by this value - it uses [VPM]::C_eta (of the point's mask color, here color 1 for the
; open flow field), shared by both scalars.
C_eta=1e-3 1e-3;
; absorb the scalars in the sponge layer, so they don't build up / wrap around the periodic domain
absorbing_sponge=1;
; Neumann (adiabatic, no-flux) boundary condition at the cylinder
scalar_BC_type=neumann;


[Discretization]
order_discretization=FD_4th_central;
filter_type=no_filter;wavelet_filter;
filter_freq=1;

[VPM]
penalization=1;
mask_time_dependent_part=1;
mask_time_independent_part=1;
dont_use_pruned_tree_mask=1;
smoothing_type=cosine;
C_eta=1.34e-3;
geometry=cylinder;
x_cntr=10.0 10.0 0;
length=1.0;


[Debug]
test_ghost_nodes_synch=1;
test_treecode=1;
test_wavelet_decomposition=0;
flush_frequency=;
