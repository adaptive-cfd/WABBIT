;------------------------------------------------------------
;------------ WABBIT PARAMETER FILE TEMPLATE ----------------
;------------------------------------------------------------
; Passive-scalar test case: 3D Taylor-Green vortex (equidistant grid, FD4/CDF40),
; with a passive-scalar gaussian blob released at t=0. The fully-periodic TGV domain
; is [0, 2*pi]^3; the standard "taylor-green-vanRees2011" velocity field vanishes at
; the domain center (pi,pi,pi) and at the origin/corners, but is LARGEST at the
; quarter points of the domain (e.g. x=y=z=pi/2). We place the blob at that quarter
; point so it is immediately, strongly deformed/stretched by the vortical strain --
; more visually interesting on a short simulated time than a blob placed at the
; (locally stagnant) domain center.
; ATTENTION: time_max below is much shorter than the usual TGV benchmark (10.0),
; since we only want to see the blob deform, not the full viscous decay -- please
; double check/adjust.


[Domain]
dim=3;
domain_size=6.283185307179586 6.283185307179586 6.283185307179586;
periodic_BC=1 1 1;
symmetry_BC=0 0 0;
symmetry_vector_component=


[Wavelet]
wavelet=CDF40;


[Blocks]
number_block_nodes=20;
number_ghost_nodes=;
number_ghost_nodes_rhs=1;
; ACM: 4 (3D) + N_scalars = 4 + 1 = 5
number_equations=5;
eps=4.0e-2;
max_treelevel=1;
min_treelevel=1;
max_forest_size=;
; equidistant grid: no adaptation at all (so the scalar cannot influence adaptation either)
adapt_tree=0;
adapt_inicond=1;
inicond_refinements=0;
refinement_indicator=everywhere;
block_dist=sfc_hilbert;
coarsening_indicator=threshold-state-vector;
coarsening_indicator_inicond=;
eps_normalized=1;
eps_norm=Linfty;
; which components to use for coarsening_indicator? [ux uy uz p scalar1]
; the scalar is excluded (0); moot here since adapt_tree=0 (equidistant), but kept
; consistent with "do not adapt after scalar".
threshold_state_vector_component=1 1 1 1 0;
threshold_mask=0;
force_maxlevel_dealiasing=0;
N_dt_per_grid=1;


[Time]
; ATTENTION: shortened from the usual TGV benchmark (time_max=10.0) -- we only want
; to see the blob deform by the vortical strain
time_max=3.0;
walltime_max=23.9;
walltime_write=;
nt=;
CFL=1.0;
CFL_eta=;
CFL_nu=;
write_method=fixed_time;
write_freq=2;
write_time=3.0;
dt_fixed=0.0;
dt_max=0.0;
time_step_method=RungeKuttaGeneric;


[Physics]
physics_type=ACM-new;
read_from_files=0;
input_files=;


[Saving]
N_fields_saved=1;
field_names=scalar1;


[Statistics]
nsave_stats=10;
tsave_stats=0.20;


[ACM-new]
c_0=10;
nu=3.125000e-03;
gamma_p=0;
u_mean_set=0.0 0.0 0.0;
inicond=taylor-green-vanRees2011;
beta=0.05;
use_passive_scalar=1;
compute_flow=1;
use_HIT_linear_forcing=0;
skew_symmetry=1;


[Sponge]
use_sponge=0;

[ConvectionDiffusion]
N_scalars=1;
; same diffusivity scale as the flow (kappa = nu/Sc = nu)
Sc=1.0;
; Rayleigh number, unused here, but the parameter is mandatory.
Ra=1.0;
symmetric_buoyancy=0;
; gaussian blob, centered at (x0source,y0source,z0source) with width "widthsource" below.
inicond=blob;
source=none;
; quarter point of the domain (pi/2, pi/2, pi/2): where the TGV velocity/vorticity is
; largest at t=0 -- see note above.
x0source=1.5707963267948966;
y0source=1.5707963267948966;
z0source=1.5707963267948966;
; ATTENTION: blob width, chosen small compared to the domain (2*pi) -- please double check.
widthsource=0.3;
; unused dummy value (source=none)
valuesource=1.0;
; unused here (no obstacle/mask in this periodic domain), but the parameter is mandatory.
C_eta=1.0;

[Discretization]
order_discretization=FD_4th_central;
filter_type=;
filter_freq=10;
filter_only_maxlevel=no;
filter_all_except_maxlevel=no;

[VPM]
penalization=0;


[FreeFlightSolver]
use_free_flight_solver=0;


[Debug]
test_ghost_nodes_synch=1;
test_treecode=0;
test_wavelet_decomposition=0;
